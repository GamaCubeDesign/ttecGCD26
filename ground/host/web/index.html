<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCD26 · Estação de solo</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="stylesheet" href="/css/gama.css">
<script>
  // The theme before the first paint, so the page never flashes the other one.
  // ?theme=light in the address wins, for screenshots and projectors.
  try {
    document.documentElement.dataset.theme =
      new URLSearchParams(location.search).get('theme') || localStorage.getItem('gs-theme') || 'dark';
  } catch (e) {}
</script>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-top">
    <div class="brand">
      <img class="mark" src="/brand/favicon.png" alt="Gama CubeDesign" width="52" height="44">
      <div class="title"><b data-t="title"></b><small id="source"></small></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="tools">
      <div class="langs" id="b-lang" role="group">
        <button class="tool" type="button" data-lang="pt" lang="pt-BR" title="Português">PT</button>
        <button class="tool" type="button" data-lang="es" lang="es" title="Español">ES</button>
        <button class="tool" type="button" data-lang="en" lang="en" title="English">EN</button>
      </div>
      <button class="tool icon" id="b-theme" type="button"></button>
      <button class="tool icon" id="b-big" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 21 21M10.5 7.8v5.4M7.8 10.5h5.4"/></svg></button>
    </div>
  </div>
  <div class="bar-sub">
    <div class="status" id="status"></div>
    <div class="hk" id="hk"></div>
  </div>
</header>
<div class="banner" id="banner" role="status"></div>
<div class="layout">
  <main id="panels"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<footer class="dock events" id="events"></footer>
<script type="module" src="/js/main.js"></script>
</body>
</html>
