# ttcd on the new OBC board (hardware/obc-v2): the TT&C board's RA-02,
# through the stack's bus, on the Pi's SPI0. Only what this board sets; every
# other key keeps its default, which is the flight value (14 dBm, the nominal
# profile) and is documented in flight/ttcd/ttcd.conf.example.
# Install: make install CONF_DIR=flight/conf/obc-v2 (README.md here).

spi_dev    = /dev/spidev0.0    # SPI0 CE0: GPIO8 NSS, 9 MISO, 10 MOSI, 11 SCK = bus J1.27, 23, 25, 21
reset_line = 25                # GPIO25 -> RA-02 NRESET, bus J1.29
dio0_line  = 4                 # GPIO4 <- RA-02 DIO0, bus J1.31; the 1-Wire moves to GPIO17 (config.txt)
