# obcd on the new OBC board (hardware/obc-v2). Only what this board sets;
# every other key keeps its default, documented in
# flight/obcd/obcd.conf.example.
# Install: make install CONF_DIR=flight/conf/obc-v2 (README.md here).

# I2C1, GPIO2/3 = bus J1.10 SDA and J1.12 SCL: the INA219 and, on the same
# wires, the AOCS ESP32, which borrows the bus during ADVANCED_AOCS (ADR-0017).
i2c_dev     = /dev/i2c-1
ina219_addr = 0x40             # A0 = A1 = GND
aocs_addr   = 0x2A             # docs/icd/obc-aocs-i2c.md

# The DS18B20 on GPIO17 (config.txt), with R1's pull-up: whichever one the
# kernel lists, so the chip's serial number is not written here.
w1_path = auto

# The TIP120s' bases, through R2 and R3: 4.7 kOhm from a 3.3 V GPIO is
# ~0.4 A of collector current at the TIP120's minimum gain, short of the
# burn-wire's 1 A (findings A5, A6; to be measured).
burnwire_line = 22             # GPIO22, bus J1.13 -> the mechanism board
heater_line   = 23             # GPIO23, bus J1.11 -> both battery boards
